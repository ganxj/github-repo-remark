<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Repo Remark</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="popup-title">
        <svg class="popup-logo" width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
          <path d="M2 2.5A1.5 1.5 0 013.5 1h5.086a1.5 1.5 0 011.06.44l3.915 3.914a1.5 1.5 0 01.439 1.06V13.5a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 012 13.5v-11z"/>
          <path d="M4 5.5a.5.5 0 01.5-.5h3a.5.5 0 010 1h-3a.5.5 0 01-.5-.5zm0 2a.5.5 0 01.5-.5h6a.5.5 0 010 1h-6a.5.5 0 01-.5-.5zm0 2a.5.5 0 01.5-.5h6a.5.5 0 010 1h-6a.5.5 0 01-.5-.5zm0 2a.5.5 0 01.5-.5h4a.5.5 0 010 1h-4a.5.5 0 01-.5-.5z" fill="white"/>
        </svg>
        <h1>Repo Remark</h1>
      </div>
      <span class="popup-count" id="noteCount">0 条备注</span>
    </header>

    <!-- Search -->
    <div class="popup-search">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
        <path d="M10.68 11.74a6 6 0 01-7.922-8.982 6 6 0 018.982 7.922l3.04 3.04a.749.749 0 01-.326 1.275.749.749 0 01-.734-.215l-3.04-3.04zM11.5 7a4.499 4.499 0 10-8.997 0A4.499 4.499 0 0011.5 7z"/>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索仓库名或备注..." autocomplete="off">
    </div>

    <!-- List -->
    <div class="popup-list" id="noteList">
      <div class="popup-empty" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 16 16" fill="currentColor" class="empty-icon">
          <path d="M2 2.5A1.5 1.5 0 013.5 1h5.086a1.5 1.5 0 011.06.44l3.915 3.914a1.5 1.5 0 01.439 1.06V13.5a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 012 13.5v-11z" opacity="0.4"/>
          <path d="M4 5.5a.5.5 0 01.5-.5h3a.5.5 0 010 1h-3a.5.5 0 01-.5-.5zm0 2a.5.5 0 01.5-.5h6a.5.5 0 010 1h-6a.5.5 0 01-.5-.5zm0 2a.5.5 0 01.5-.5h6a.5.5 0 010 1h-6a.5.5 0 01-.5-.5zm0 2a.5.5 0 01.5-.5h4a.5.5 0 010 1h-4a.5.5 0 01-.5-.5z" fill="white" opacity="0.6"/>
        </svg>
        <p>还没有备注</p>
        <p class="empty-hint">浏览 GitHub 仓库时点击📝图标添加备注</p>
      </div>
    </div>

    <!-- Loading -->
    <div class="popup-loading" id="loadingState" style="display:none;">
      <div class="loading-spinner"></div>
      <p>加载中...</p>
    </div>

    <!-- Footer -->
    <footer class="popup-footer" id="footer" style="display:none;">
      <button class="footer-btn" id="btnGotoTrending">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0a8 8 0 110 16A8 8 0 018 0zM4.5 7.5a.5.5 0 000 1h5.793l-2.147 2.146a.5.5 0 00.708.708l3-3a.5.5 0 000-.708l-3-3a.5.5 0 10-.708.708L10.293 7.5H4.5z"/>
        </svg>
        去 Trending 看看
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
